# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# -- JVM & Memory --
# Gradle daemon: 4GB heap, optimize GC
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin compiler daemon: separate process, 4GB heap
kotlin.daemon.jvmargs=-Xmx2048m

# -- Parallelism & Caching --
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
# Max parallel workers (default = CPU cores)
# org.gradle.workers.max=8

# -- Kotlin --
kotlin.code.style=official
kotlin.incremental=true
kotlin.build.report.output=file

# -- Android --
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.overridePathCheck=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 手机端本地打包（qemu aapt2）：CI 构建前会被 workflow 清理
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/37.0.0/aapt2
android.aapt2DaemonMode=false
